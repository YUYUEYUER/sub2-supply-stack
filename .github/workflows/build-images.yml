name: Build GHCR images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bridge tests
        working-directory: supply-bridge
        run: python -m unittest discover -s tests -v

  build-bridge:
    needs: test-bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./supply-bridge
          push: true
          tags: ghcr.io/yuyueyuer/sub2-supply-bridge:1.0.21
          cache-from: type=gha,scope=sub2-supply-bridge
          cache-to: type=gha,mode=max,scope=sub2-supply-bridge

  build-sub2api:
    needs: test-bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Wei-Shaw/sub2api
          ref: v0.1.177
          path: sub2api
      - name: Align Go toolchain with v0.1.177 requirements
        run: sed -i 's/golang:1.26.5-alpine/golang:1.26.6-alpine/' sub2api/Dockerfile
      - name: Apply HTTP to WebSocket upstream patch
        run: git -C sub2api apply --check ../patches/http-ws.patch && git -C sub2api apply ../patches/http-ws.patch
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./sub2api
          push: true
          build-args: |
            VERSION=0.1.177-http-ws.1
            COMMIT=${{ github.sha }}
          tags: ghcr.io/yuyueyuer/sub2api-custom:0.1.177-http-ws.1
          cache-from: type=gha,scope=sub2api-custom
          cache-to: type=gha,mode=max,scope=sub2api-custom
